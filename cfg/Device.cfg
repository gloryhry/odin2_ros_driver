#!/usr/bin/env python3
PACKAGE = 'odin2_ros_driver'
from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()
for name in ['raw_point', 'slam_point', 'camera0', 'camera1', 'imu', 'odom_lf', 'odom_hf', 'tf', 'telemetry']:
    gen.add(name + '_enabled', bool_t, 1, 'Subscribe and publish this channel', name in ['raw_point', 'imu', 'telemetry'])
    rate_description = ('Image publication limit; encoded packets are always forwarded' if name in ['camera0', 'camera1']
                        else 'Host publication limit; 0 means every sample')
    gen.add(name + '_publish_rate', double_t, 1, rate_description, 0, 0, 2000)
gen.add('apply_adaptive', bool_t, 2, 'Apply and verify the following adaptive device parameters', False)
gen.add('apply_filters', bool_t, 2, 'Deprecated and rejected; use apply_adaptive', False)
gen.add('confidence_threshold', int_t, 2, 'Deprecated and unsupported; changes are rejected', 0, 0, 255)
gen.add('min_depth', int_t, 2, 'Deprecated and unsupported; changes are rejected', 150, 0, 65535)
gen.add('cdf_percentile', int_t, 2, 'Adaptive percentile in 0.01 percent', 7000, 1, 10000)
gen.add('outdoor_threshold', int_t, 2, 'Adaptive outdoor threshold in millimetres', 3000, 0, 65535)
exit(gen.generate(PACKAGE, 'odin2_ros_driver', 'Device'))
