#!/usr/bin/env python3
PACKAGE = 'odin2_ros_driver'
from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()
for name in ['raw_point', 'slam_point', 'camera0', 'camera1', 'imu', 'odom_lf', 'odom_hf', 'tf', 'telemetry']:
    gen.add(name + '_enabled', bool_t, 1, 'Subscribe and publish this channel', name in ['raw_point', 'imu', 'telemetry'])
    gen.add(name + '_publish_rate', double_t, 1, 'Host publication limit; 0 means every sample', 0, 0, 2000)
gen.add('apply_filters', bool_t, 2, 'Explicitly apply the following device filter parameters', False)
gen.add('confidence_threshold', int_t, 2, 'Device confidence threshold', 0, 0, 255)
gen.add('min_depth', int_t, 2, 'Device minimum depth in millimetres', 150, 0, 65535)
gen.add('cdf_percentile', int_t, 2, 'Adaptive percentile in 0.01 percent', 7000, 1, 10000)
gen.add('outdoor_threshold', int_t, 2, 'Adaptive outdoor threshold in millimetres', 3000, 0, 65535)
exit(gen.generate(PACKAGE, 'odin2_ros_driver', 'Device'))
