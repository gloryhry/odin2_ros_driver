name: Jetson GA image matrix and GHCR release
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odin2-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate catalog and deployment contract
        id: catalog
        run: |
          python3 test/jetson_support_test.py
          python3 docker/jetson-support.py validate --download
          echo "matrix=$(python3 docker/jetson-support.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: catalog
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image name
        id: image
        env:
          REPOSITORY_SUFFIX: ${{ matrix.repository_suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}$REPOSITORY_SUFFIX" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test, build and export image digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.jetson
          target: runtime
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.odin2.sdk.version=3.3.0_20260822
            io.odin2.jetpack=${{ matrix.jetpack }}
            io.odin2.target.l4t=${{ matrix.l4t }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_JOBS=2
            L4T_BASE_IMAGE=${{ matrix.base_image }}
            L4T_VERSION=${{ matrix.l4t }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=odin2-jetson-${{ matrix.l4t }}
          cache-to: type=gha,mode=max,scope=odin2-jetson-${{ matrix.l4t }}
      - name: Export test reports
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.jetson
          target: test-results
          platforms: linux/arm64
          build-args: |
            BUILD_JOBS=2
            L4T_BASE_IMAGE=${{ matrix.base_image }}
            L4T_VERSION=${{ matrix.l4t }}
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=local,dest=reports
          cache-from: type=gha,scope=odin2-jetson-${{ matrix.l4t }}
      - name: Record validation boundary
        env:
          L4T: ${{ matrix.l4t }}
          JETPACK: ${{ matrix.jetpack }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          record = {"l4t": os.environ["L4T"], "jetpack": os.environ["JETPACK"],
                    "source_revision": os.environ["GITHUB_SHA"], "digest": os.environ["DIGEST"],
                    "build": "passed", "environment_preflight": "not_run", "real_hardware": "not_run"}
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/jetson-build.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jetson-${{ matrix.l4t }}
          path: reports
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: jetson-*
          path: reports
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all digests and publish version tags and legacy aliases
        run: python3 docker/publish-jetson.py reports
