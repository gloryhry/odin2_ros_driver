name: Jetson image build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        l4t: ['35.4.1', '36.4.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.jetson
          target: runtime
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_JOBS=2
            L4T_BASE_IMAGE=nvcr.io/nvidia/l4t-jetpack:r${{ matrix.l4t }}
          cache-from: type=gha,scope=odin2-jetson-${{ matrix.l4t }}
          cache-to: type=gha,mode=max,scope=odin2-jetson-${{ matrix.l4t }}
