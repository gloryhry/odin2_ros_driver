services:
  odin2:
    image: ${ODIN2_JETSON_IMAGE:-odin2-ros-driver:jetson-local}
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_REQUIRE_JETPACK: csv-mounts=all
    volumes:
      - type: bind
        source: /etc/nv_tegra_release
        target: /run/host-nv_tegra_release
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/dpkg/status
        target: /run/host-dpkg-status
        read_only: true
        bind:
          create_host_path: false
